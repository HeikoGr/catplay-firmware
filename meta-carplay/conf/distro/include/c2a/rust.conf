#RUST_VERSION = "1.86.0"
#require conf/distro/include/rust_versions.inc

RUST_PANIC_STRATEGY:class-target = "abort"
CARGO_FEATURES:class-target = ""
#CARGO_FEATURES:class-native = "panic-unwind backtrace"

# C2A deliberately builds Rust's target standard library without unwinding.
# Older OE-Core releases expressed the musl dependency directly as libunwind;
# Wrynose routes it through libcxx, whose recipe builds LLVM libunwind.a and
# pulls compiler-rt into the target graph.  Remove both spellings so the
# panic=abort policy does not bring any LLVM unwinder runtime into firmware.
DEPENDS:remove:libc-musl:pn-libstd-rs = "libunwind libcxx"
