TOOLCHAIN = "clang"
DEBUG_BUILD = "0"

FULL_OPTIMIZATION:toolchain-clang = "-Oz -pipe"

PACKAGE_DEBUG_SPLIT_STYLE:toolchain-clang = "none"
INHIBIT_PACKAGE_DEBUG_SPLIT:toolchain-clang = "1"

LLVM_TARGETS_TO_BUILD = "ARM;X86"

# Force using llvm libc++, but not when bootstraping or with gcc
TC_CXX_RUNTIME:class-target:toolchain-clang = "llvm"

# OE-Core's Wrynose clang toolchain selects libcxx as a dependency for the
# LLVM C++ runtime, but does not pass the matching driver option to ordinary
# target recipes.  Keep the runtime choice visible in TARGET_CXXFLAGS so
# clang++ also finds ${STAGING_INCDIR}/c++/v1 (for example while building
# zstd's pzstd helper).
LIBCPLUSPLUS:class-target:toolchain-clang = "${@bb.utils.contains('TC_CXX_RUNTIME', 'llvm', '-stdlib=libc++', '', d)}"
TARGET_CXXFLAGS:append:class-target:toolchain-clang = " ${LIBCPLUSPLUS}"

# Wrynose's compiler-rt builds llvm-libgcc and provides libgcc for the LLVM
# runtime used by ARMv7VE targets. Provider resolution happens before
# recipe-local toolchain overrides are active, so select it through the tune
# override. MIPS and ARMv5 keep OE-Core's GNU libgcc default.
PREFERRED_PROVIDER_libgcc:armv7ve = "compiler-rt"


# Fix mips kernel build
LINKER_HASH_STYLE:mipsarch = "sysv"
LLVM_TARGETS_TO_BUILD:append = ";Mips"
# mips-oe-linux-ld.lld: error: relocation R_MIPS_32 cannot be used against local symbol; recompile with -fPIC
TC_CXX_RUNTIME:class-target:toolchain-clang:mipsarch = ""
LIBCPLUSPLUS:class-target:toolchain-clang:mipsarch = ""
# Since Wrynose, OE-Core's clang toolchain class adds these LLVM runtimes
# directly to every target recipe's BASE_DEFAULT_DEPS.  MIPS deliberately
# uses the GNU runtime above, so keep unused libcxx (and its bundled
# libunwind) plus compiler-rt out of the target dependency graph.
BASE_DEFAULT_DEPS:remove:class-target:toolchain-clang:mipsarch = "compiler-rt libcxx"

# compiler-rt's static builtins archive embeds build-directory strings on
# MIPS. Keep the exception scoped to the affected package and QA check.
INSANE_SKIP:compiler-rt-staticdev:pn-compiler-rt += "buildpaths"

# LLVM 22's static libc++, libc++abi, experimental and libunwind archives keep
# build-directory strings. Keep the exception limited to libcxx-staticdev;
# shared runtime packages and all other libcxx QA checks remain enabled.
INSANE_SKIP:libcxx-staticdev:pn-libcxx += "buildpaths"

# NE10's LTO-enabled static archive retains LLVM bitcode paths from its build
# directory.  Limit the exception to that archive package and QA check.
INSANE_SKIP:ne10-staticdev:pn-ne10 += "buildpaths"

# Fix riscv32 bootstrap
LLVM_TARGETS_TO_BUILD:append = ";RISCV"

# LLVM 22 supports the RISCV32 compiler backend and compiler-rt builtins, but
# llvm-libgcc does not provide a RISCV32 libgcc-compatible runtime.  Keep Clang
# as the compiler while using GCC's libgcc/libstdc++ runtime, as on MIPS.  This
# also prevents compiler-rt and GCC's libgcc recipe from both providing libgcc.
TC_CXX_RUNTIME:class-target:toolchain-clang:riscv32 = "gnu"
LIBCPLUSPLUS:class-target:toolchain-clang:riscv32 = ""
BASE_DEFAULT_DEPS:remove:class-target:toolchain-clang:riscv32 = "compiler-rt libcxx"
PREFERRED_PROVIDER_libgcc:riscv32 = "libgcc"

### ARMv5 FIXES START

# Clang emits the ARMv5 __atomic_* calls for operations that are not lock-free;
# resolve them from GNU libatomic for target recipes using the GNU runtime.
# Keep the flag out of the GCC/musl bootstrap chain itself.
LDFLAGS:append:toolchain-clang:runtime-gnu:armv5 = " -Wl,--no-as-needed -latomic -Wl,--as-needed"
LDFLAGS:remove:pn-musl:toolchain-clang:runtime-gnu:armv5 = "-Wl,--no-as-needed -latomic -Wl,--as-needed"

# AK3918 is ARM926EJ-S/ARMv5TE. LLVM compiler-rt 18 currently emits/validates
# DMB in its ARM atomic builtins, which is unavailable on this CPU. Keep Clang
# as the target compiler, but use the GNU runtime on ARMv5.
TC_CXX_RUNTIME:class-target:toolchain-clang:armv5 = "gnu"
# Since Wrynose, OE-Core's clang toolchain class adds compiler-rt and libcxx
# directly to BASE_DEFAULT_DEPS. ARMv5 uses the GNU runtime, so remove both
# LLVM runtime dependencies at their new source.
BASE_DEFAULT_DEPS:remove:class-target:toolchain-clang:armv5 = "compiler-rt libcxx"
COMPILER_RT:pn-clang:toolchain-clang:armv5 = "-rtlib=libgcc --unwindlib=libgcc"
# meta-clang marks some recipes non-clangable by adding -rtlib=compiler-rt;
# remove that request for every ARMv5 target recipe instead of chasing them
# one by one (the normal runtime remains GNU/libgcc).
COMPILER_RT:remove:toolchain-clang:runtime-gnu:armv5 = "-rtlib=compiler-rt"
PACKAGECONFIG:remove:pn-clang:armv5 = "compiler-rt"
DEPENDS:remove:pn-clang:class-target:armv5 = "compiler-rt"
PACKAGECONFIG:remove:pn-libcxx:armv5 = "compiler-rt"
# Diagnostic hard stop: expose any remaining target dependency on compiler-rt
# immediately instead of allowing LLVM's ARMv5 atomic assembler to fail late.
COMPATIBLE_HOST:pn-compiler-rt:armv5 = "^$"
# BusyBox is linked statically. Pull gcc-runtime into its sysroot so -latomic
# resolves to libatomic.a rather than the dynamic libatomic.so.
DEPENDS:append:pn-busybox:armv5 = " gcc-runtime"
LDFLAGS:remove:pn-busybox:toolchain-clang:runtime-gnu:armv5 = " -Wl,--no-as-needed -latomic -Wl,--as-needed"
LDFLAGS:append:pn-busybox:toolchain-clang:runtime-gnu:armv5 = " -Wl,-Bstatic -latomic -Wl,-Bdynamic"

### ARMv5 FIXES END
