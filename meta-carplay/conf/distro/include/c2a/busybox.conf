# More busybox!
# Wrynose defaults INIT_MANAGER to systemd, which also enables usrmerge.
# C2A uses the Wrynose BusyBox/mdev profile and the initscripts package.
INIT_MANAGER = "mdev-busybox"

# Older OE-Core releases backfilled sysvinit while BusyBox remained the init
# provider.  Wrynose removed that backfill, so retain the feature explicitly:
# it enables SysV-style service scripts and rc?.d links without replacing
# BusyBox as PID 1.
DISTRO_FEATURES:append = " sysvinit"

#VIRTUAL-RUNTIME_useradd = "busybox"
#VIRTUAL-RUNTIME_modutils = "busybox"
#VIRTUAL-RUNTIME_shadow-utils = "busybox"
VIRTUAL-RUNTIME_login_manager = "busybox"
#VIRTUAL-RUNTIME_kmod = "busybox"
#VIRTUAL-RUNTIME_init_manager = "sysvinit"
VIRTUAL-RUNTIME_init_manager = "busybox"
