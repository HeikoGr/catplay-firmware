## BLACKLIST: Segmation fault
#LTO:pn-zlib:toolchain-clang = ""

# clang-legacy produces a fat LTO libzstd.a whose embedded LLVM module keeps
# the absolute source path despite DEBUG_PREFIX_MAP. Wrynose's buildpaths QA
# scans the archive and rejects it, so build zstd without LTO.
LTO:pn-zstd:toolchain-clang = ""

# Their installed static archives retain the absolute module source path in
# clang-legacy's embedded fat-LTO bitcode, which fails Wrynose buildpaths QA.
LTO:pn-json-c:toolchain-clang = ""
LTO:pn-wayland:toolchain-clang = ""
LTO:pn-libjpeg-turbo:toolchain-clang = ""
LTO:pn-libyuv:toolchain-clang = ""
LTO:pn-libsdl2:toolchain-clang = ""

# OE-Core disables LTO for perl, but meta-clang's more specific clang-legacy
# override enables it again. perl-cross omits LDFLAGS in feature link checks,
# which then makes GNU ld look for a missing LLVMgold.so and misdetect libc.
LTO:pn-perl:toolchain-clang = ""

# Clang 22 diagnoses gettext-wrapped, argument-free error messages in gnulib
# as non-literal formats. Keep the diagnostic, but do not make it fatal.
CFLAGS:append:pn-coreutils:toolchain-clang = " -Wno-error=format-security"

# Wayland ptests discover cases through __start/__stop_test_section. LLD drops
# those encapsulation symbols with --gc-sections unless explicitly retained.
LDFLAGS:append:pn-wayland:toolchain-clang = " ${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-Wl,-z,nostart-stop-gc', '', d)}"

#TOOLCHAIN:pn-elfutils:forcevariable = "gcc"
#TOOLCHAIN:pn-make-mod-scripts:forcevariable = "gcc"

# MIPS fixes

TOOLCHAIN:pn-libffi:mipsarch:forcevariable = "gcc"
#TOOLCHAIN:pn-libxcrypt:mipsarch:forcevariable = "gcc"

LDFLAGS:append:pn-libxcrypt:toolchain-gcc = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -Wl,--undefined-version', '', d)}"

LDFLAGS:append:pn-libxcrypt:toolchain-gcc = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-libxcrypt:toolchain-gcc = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

LDFLAGS:append:pn-libffi:toolchain-gcc = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-libffi:toolchain-gcc = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

LDFLAGS:append:pn-busybox:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-busybox:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

# LLD rejects the non-PIC R_MIPS_32 relocations in GCC's O32 libgcc.a when
# libtommath links its shared library. GNU ld accepts this ABI and consumes
# the Clang LTO objects through LLVMgold.so.
LDFLAGS:append:pn-libtommath:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-libtommath:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

# util-linux-libuuid hits the same non-PIC O32 libgcc relocation limitation.
LDFLAGS:append:pn-util-linux-libuuid:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-util-linux-libuuid:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"
LDFLAGS:append:pn-util-linux:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-util-linux:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

# gdbm also links against the non-PIC MIPS O32 libgcc archive.
LDFLAGS:append:pn-gdbm:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-gdbm:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

# wolfssl also links against the non-PIC MIPS O32 libgcc archive.
LDFLAGS:append:pn-wolfssl:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-wolfssl:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

# libnl also links against the non-PIC MIPS O32 libgcc archive.
LDFLAGS:append:pn-libnl:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-libnl:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

# libopus and alsa-lib hit the same relocation while linking their shared
# libraries against GNU's non-PIC MIPS O32 libgcc.a.
LDFLAGS:append:pn-libopus:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-libopus:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"
LDFLAGS:append:pn-libopusenc:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-libopusenc:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"
LDFLAGS:append:pn-alsa-lib:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-alsa-lib:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"

LDFLAGS:append:pn-perl:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', ' -fuse-ld=bfd', '', d)}"
LDFLAGS:remove:pn-perl:mipsarch = "${@bb.utils.contains('DISTRO_FEATURES', 'ld-is-lld', '-fuse-ld=lld', '', d)}"
