DISTRO_VERSION = "c2a"

DISTRO_FEATURES = "ipv4 ipv6 usbhost usbgadget wifi bluetooth vfat lto ld-is-lld"
# Wrynose appends every feature from DISTRO_FEATURES_DEFAULTS unless it is
# explicitly opted out.  Keep the effective feature set equivalent to the
# deliberately minimal C2A list above; in particular, enabling ptest here pulls
# test-only dependencies (including a target LLVM build) into normal firmware
# builds while USE_NLS=no leaves some of those test dependencies unsatisfied.
DISTRO_FEATURES_OPTED_OUT = "\
    acl alsa debuginfod ext2 xattr nfs zeroconf pci 3g nfc x11 seccomp \
    pulseaudio gobject-introspection-data ldconfig opengl ptest multiarch \
    wayland vulkan \
"

C2A_SYSTEM_PACKAGES = "\
    initscripts \
    busybox \
    bluez5 \
    dbus \
    wireless-regdb-static \
    hostapd \
    wpa-supplicant \
    c2a-overlay-init \
    dropbear openssh-sftp-server \
"
PACKAGE_CLASSES = "package_ipk"

# Fix respawn spam
SYSVINIT_ENABLED_GETTYS = ""

USE_NLS = "no"

# OpenEmbedded uses pigz by default which results in bad compression ratio for kernel
PREFERRED_PROVIDER_gzip-native = "gzip-native"
PROVIDES:remove:pn-pigz-native:class-native = "gzip-native"
CONVERSION_DEPENDS_gz:forcevariable = "gzip-native"
